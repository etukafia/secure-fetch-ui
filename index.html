<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Media Fetch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom neon glow effects */
        .neon-border { border-color: #d9f95f; }
        .neon-bg { background-color: #d9f95f; color: #111827; }
        .neon-bg:hover { background-color: #c4e54c; }
        .neon-text { color: #d9f95f; }
        
        .tab-btn { transition: all 0.2s; }
        .tab-active { border-color: #d9f95f; color: #d9f95f; background-color: rgba(217, 249, 95, 0.05); }
        .tab-inactive { border-color: #374151; color: #9ca3af; }
        .tab-inactive:hover { border-color: #4b5563; color: #e5e7eb; }
    </style>
</head>
<body class="bg-[#1a1b1e] text-gray-200 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-[#25262b] rounded-2xl shadow-2xl p-6 md:p-8 w-full max-w-lg border border-gray-800">
        
        <div class="mb-8 text-center flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide text-gray-100">Fetch<span class="neon-text">Node</span></h1>
            <input type="password" id="passcode-input" placeholder="Passcode" class="w-32 px-3 py-1.5 rounded-lg bg-[#1a1b1e] border border-gray-700 focus:outline-none focus:border-[#d9f95f] text-sm text-center">
        </div>

        <div class="mb-6">
            <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Video URL</label>
            <div class="relative">
                <input type="url" id="link-input" placeholder="https://..." class="w-full px-4 py-3 rounded-xl bg-[#1a1b1e] border border-gray-700 focus:outline-none focus:border-[#d9f95f] text-gray-100 placeholder-gray-600 transition-all pr-10">
                <button id="clear-btn" class="absolute right-3 top-3.5 text-gray-500 hover:text-gray-300 hidden">✕</button>
            </div>
            
            <div id="platform-badge" class="mt-3 hidden items-center px-4 py-2 rounded-lg border border-[#d9f95f] bg-[#d9f95f]/10">
                <svg class="w-4 h-4 neon-text mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                <span id="platform-name" class="text-sm font-medium neon-text">Platform detected</span>
            </div>
        </div>

        <div class="mb-8">
            <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Quality</label>
            <div class="grid grid-cols-4 gap-2">
                <button data-quality="best" class="quality-btn tab-active border rounded-lg py-2 text-sm font-medium">Best</button>
                <button data-quality="720p" class="quality-btn tab-inactive border rounded-lg py-2 text-sm font-medium">720p</button>
                <button data-quality="480p" class="quality-btn tab-inactive border rounded-lg py-2 text-sm font-medium">480p</button>
                <button data-quality="audio" class="quality-btn tab-inactive border rounded-lg py-2 text-sm font-medium">Audio</button>
            </div>
        </div>

        <div id="status-area" class="mb-6 hidden items-center px-4 py-3 rounded-lg border border-emerald-500 bg-emerald-500/10">
            <svg class="w-5 h-5 text-emerald-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span id="status-text" class="text-sm font-medium text-emerald-400">Ready to download.</span>
        </div>

        <button id="action-btn" class="w-full neon-bg font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all duration-200 active:scale-95 flex items-center justify-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Extract & Download
        </button>

    </div>

    <script>
        // ==========================================
        // PASTE YOUR RENDER URL HERE (No trailing slash)
        const RENDER_URL = 'YOUR_RENDER_URL_HERE'; 
        // ==========================================

        const input = document.getElementById('link-input');
        const clearBtn = document.getElementById('clear-btn');
        const passcodeInput = document.getElementById('passcode-input');
        const actionBtn = document.getElementById('action-btn');
        const platformBadge = document.getElementById('platform-badge');
        const platformName = document.getElementById('platform-name');
        const statusArea = document.getElementById('status-area');
        const statusText = document.getElementById('status-text');
        
        let selectedQuality = 'best';
        let extractedVideoUrl = null;

        // Platform Detection Logic
        input.addEventListener('input', () => {
            const val = input.value.toLowerCase();
            clearBtn.style.display = val ? 'block' : 'none';
            
            // Reset state when typing a new link
            extractedVideoUrl = null;
            statusArea.classList.add('hidden');
            actionBtn.innerHTML = '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Extract & Download';

            if (val.includes('instagram.com')) showPlatform('Instagram detected');
            else if (val.includes('youtube.com') || val.includes('youtu.be')) showPlatform('YouTube detected');
            else if (val.includes('twitter.com') || val.includes('x.com')) showPlatform('Twitter/X detected');
            else if (val.includes('tiktok.com')) showPlatform('TikTok detected');
            else platformBadge.classList.add('hidden');
        });

        function showPlatform(name) {
            platformName.innerText = name;
            platformBadge.classList.remove('hidden');
            platformBadge.classList.add('flex');
        }

        clearBtn.addEventListener('click', () => {
            input.value = '';
            clearBtn.style.display = 'none';
            platformBadge.classList.add('hidden');
        });

        // Quality Button Logic
        document.querySelectorAll('.quality-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.quality-btn').forEach(b => {
                    b.classList.remove('tab-active');
                    b.classList.add('tab-inactive');
                });
                e.target.classList.remove('tab-inactive');
                e.target.classList.add('tab-active');
                selectedQuality = e.target.getAttribute('data-quality');
            });
        });

        // The Master Action Button
        actionBtn.addEventListener('click', async () => {
            // If we already extracted it, trigger the download proxy
            if (extractedVideoUrl) {
                window.location.href = `${RENDER_URL}/download?url=${encodeURIComponent(extractedVideoUrl)}`;
                return;
            }

            const url = input.value;
            const secretCode = passcodeInput.value;

            if (!secretCode) return alert('Please enter your passcode at the top right!');
            if (!url) return alert('Please paste a link first!');

            actionBtn.innerText = 'Extracting... Please wait';
            actionBtn.disabled = true;
            actionBtn.classList.add('opacity-75');

            try {
                const response = await fetch(`${RENDER_URL}/extract`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, passcode: secretCode, quality: selectedQuality }) 
                });

                const data = await response.json();

                if (data.success) {
                    extractedVideoUrl = data.video_url;
                    
                    statusText.innerText = 'Extracted successfully! Ready to save.';
                    statusArea.classList.remove('hidden');
                    statusArea.classList.add('flex');
                    
                    actionBtn.innerHTML = 'Save to Device';
                } else {
                    alert(data.error); 
                }
            } catch (error) {
                alert('Server error or waking up. Try again in a moment!');
            } finally {
                if (!extractedVideoUrl) {
                    actionBtn.innerHTML = '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Extract & Download';
                }
                actionBtn.disabled = false;
                actionBtn.classList.remove('opacity-75');
            }
        });
    </script>
</body>
</html>
